<title>VolApp</title>

<style>
/* Layout: one phone-width column; tabs as a floating pill bar; live screen fills the viewport. */
:root {
  --bg: #2A2925; --raised: #35342F; --line: #46443E;

.setdots i.us { background: var(--orange); } .setdots i.them { background: var(--tx-m); }
.court { background: var(--sage); border-radius: var(--r-xl); padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; position: relative; }

.pl { min-height: 72px; border-radius: var(--r-md); background: var(--cream); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; position: relative; transition: transform .1s, background .15s; }

  padding-top: 10px; padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up .2s ease-out; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--tx-m); }
.input { min-height: 56px; border-radius: var(--r-md); background: var(--raised); border: 1.5px solid var(--line); color: var(--tx); padding: 0 16px; font: 500 17px var(--body); width: 100%; }

.scores2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.tap.us { background: rgba(235,110,58,.16); border-color: rgba(235,110,58,.55); }
.tap .tname { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tx-m); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.live .court { margin-top: auto; }

<script>

  swap: '<path d="M7 4 4 7l3 3M4 7h12M17 14l3 3-3 3M20 17H8"/>',

  if (sync.state === 'offline') return [`Sin conexión${n ? ` · ${n} sin enviar` : ''}`, 'var(--red-s)'];
  if (sync.state === 'error') return [`Error al sincronizar${n ? ` · ${n} sin enviar` : ''}`, 'var(--red-s)'];
  if (sync.state === 'connecting') return ['Conectando…', 'var(--ochre)'];
  if (n || sync.state === 'saving') return ['Guardando…', 'var(--ochre)'];
  return ['Al día', 'var(--green-s)'];
}
function syncBadge() {
  if (!SHARED) return '';
  const [txt, col] = syncLabel();
  return `<span class="chip quiet" data-sync="badge" style="gap:6px"><i style="width:8px;height:8px;border-radius:4px;background:${col};display:block"></i>${txt}</span>`;
}
function syncDot() {
  if (!SHARED) return '';
  const [txt, col] = syncLabel();
  return `<i data-sync="dot" title="${txt}" aria-label="${txt}" style="width:9px;height:9px;border-radius:5px;background:${col};display:inline-block;margin-right:6px"></i>`;
}
function setSync(state) {
  sync.state = state;
  document.querySelectorAll('[data-sync]').forEach((el) => { el.outerHTML = el.dataset.sync === 'dot' ? syncDot() : syncBadge(); });
}

/** Reads a pasted backup, undoing what chat and notes apps tend to do to it. */
function parseBackup(text) {
  let t = String(text)
    .replace(/[“”„‟″«»]/g, '"').replace(/[‘’‚′]/g, "'")
    .replace(/[​-‍⁠﻿]/g, '').replace(/[  ]/g, ' ');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0) throw new Error('No encuentro ninguna copia en el texto. Tiene que empezar por una llave {.');
  if (b < a) throw new Error(`La copia está cortada: le falta el final (${t.length} caracteres). Vuelve a copiarla entera.`);
  t = t.slice(a, b + 1);
  let d;
  try { d = JSON.parse(t); } catch (e) { throw new Error(`La copia está incompleta o dañada (${t.length} caracteres). Vuelve a copiarla entera, sin pasar por Notas.`); }
  if (!d || !Array.isArray(d.players) || !Array.isArray(d.matches)) throw new Error('Ese texto no es una copia de VolApp.');
  return d;
}

function newMatch(opponent, date, bestOf, lineup, liberoIds, firstServer) {
  return { id: newId(), opponent, date, bestOf, events: [{ id: newId(), t: 'set_start', lineup, liberoIds, firstServer }] };
}
const P = (id) => DB.players.find((p) => p.id === id) || { id, name: '?', n: '?', pos: 'receptora', lib: false, active: false };
const first = (id) => P(id).name.split(' ')[0];
const finished = () => DB.matches.filter((m) => m.status === 'finished').sort((a, b) => a.date.localeCompare(b.date));
const liveMatch = () => DB.matches.find((m) => m.status === 'live');
const matchById = (id) => DB.matches.find((m) => m.id === id);
const cur = () => (route.id && matchById(route.id)) || liveMatch();
const roster = () => DB.players.filter((p) => p.active !== false);
const planned = () => DB.matches.filter((m) => m.status === 'planned').sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
const mapsUrl = (place) => 'https:' + '/' + '/www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place); // Written in pieces: Apps Script strips anything after two slashes.
const planReady = (m) => { const ids = new Set(roster().map((p) => p.id)); const l = m.plan && m.plan.lineup; return !!(l && l.length === 6 && l.every((id) => id && ids.has(id))); };
const today = () => new Date().toISOString().slice(0, 10);

// ---------- UI state & routing -----------------------------------------------
let route = { name: 'home' }; const stack = [];
const ui = { sel: null, sheet: null, wiz: null, momSet: 0, rotSel: null, open: {}, ficha: 'season', lastScore: null, form: null };
const go = (r) => { stack.push(route); route = r; ui.open = {}; ui.rotSel = null; ui.momSet = 0; render(true); };
const back = () => { route = stack.pop() || { name: 'home' }; render(true); };
let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1900);
}

// ---------- Shared pieces ----------------------------------------------------
function header(title, sub, withBack = true, right = '') {
  return `<div class="row" style="gap:12px">${withBack ? `<button class="back" data-a="back" aria-label="Volver">${icon('back')}</button>` : ''}
    <div style="flex:1;min-width:0">${sub ? `<div class="eyebrow">${esc(sub)}</div>` : ''}<h2>${esc(title)}</h2></div>${right}</div>`;
}
function tabbar() {
  const tabs = [['home', 'Inicio', 'home'], ['team', 'Equipo', 'team'], ['season', 'Temporada', 'season']];
  return `<nav class="tabbar" aria-label="Secciones"><div class="track">${tabs.map(([n, l, i]) => `<button class="tab ${route.name === n ? 'on' : ''}" data-a="tab" data-v="${n}" aria-label="${l}">${icon(i, 20)}${route.name === n ? l : ''}</button>`).join('')}</div></nav>`;
}
function outcome(st) { return st.setsUs > st.setsThem ? 'win' : st.setsUs < st.setsThem ? 'loss' : 'tie'; }
const OUTCOME = { win: ['Victoria', 'G', 'win'], loss: ['Derrota', 'P', 'loss'], tie: ['Empate', 'E', 'quiet'] };
function resultLine(m) {
  const st = replay(m); const o = outcome(st); const won = o === 'win';
  return { st, won, o, chip: OUTCOME[o][2], letter: OUTCOME[o][1], text: `${OUTCOME[o][0]} ${st.setsUs}–${st.setsThem}`, sets: st.sets.map((s) => `${s.us}–${s.them}`).join(' · ') };
}
const setChip = (s) => (s.winner === 'us' ? 'win' : s.winner === 'them' ? 'loss' : 'light');
function stackBar(a, b, ca, cb, label) {
  const tot = a + b || 1;
  return `<div class="stackbar" role="img" aria-label="${label}">${a ? `<div style="flex:${a};background:${ca}">${a}</div>` : ''}${b ? `<div style="flex:${b};background:${cb}">${b}</div>` : ''}</div>`;
}
function spark(vals, w = 96, h = 30, color = 'var(--orange)') {
  if (vals.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const xy = vals.map((v, i) => [3 + (i * (w - 6)) / (vals.length - 1), h - 4 - ((v - min) / (max - min || 1)) * (h - 8)]);
  const d = xy.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
  const last = xy[xy.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}L${last[0]} ${h}L3 ${h}Z" fill="${color}" opacity=".15"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/></svg>`;
}
/** Buttons to carry on with a match that closed itself because of its set count. */
function extendButtons(st, cls) {
  if (st.endedEarly) return '';
  const opts = (st.bestOf === 3 ? [[5, 'Pasar a mejor de 5']] : []).concat([[0, 'Sets sin límite']]);
  return opts.map(([v, l]) => `<button class="${cls}" data-a="extendMatch" data-v="${v}">${l}</button>`).join('');
}

function rulesFields(r, scope) {
  const pill = (field, v, label) => `<button class="pill ${String(r[field]) === String(v) ? 'on' : ''}" data-a="rule" data-v="${scope}:${field}:${v}">${label}</button>`;
  return `<div class="field"><label>Puntos para ganar el set</label>
      <div class="stepper"><button class="sb" data-a="rule" data-v="${scope}:target:-1" aria-label="Un punto menos">−</button><span class="val" aria-live="polite">${r.target}</span><button class="sb" data-a="rule" data-v="${scope}:target:+1" aria-label="Un punto más">+</button></div>
      <div class="pills">${[15, 21, 25].map((n) => `<button class="pill ${r.target === n ? 'on' : ''}" data-a="rule" data-v="${scope}:target:=${n}">${n}</button>`).join('')}</div></div>
    <div class="field"><label>¿Hay que ganar por 2?</label><div class="pills">${pill('by2', true, 'Sí')}${pill('by2', false, 'No')}</div></div>
    <div class="field"><label>Sets</label><div class="pills">${pill('bestOf', 3, 'Mejor de 3')}${pill('bestOf', 5, 'Mejor de 5')}${pill('bestOf', 0, 'Sin límite')}</div></div>`;
}
function zonesHtml(lineup, serveUs, target) {
  const zone = (i, z) => { const id = lineup[i]; const p = id ? P(id) : null; return `<button class="zbtn ${p ? '' : 'emptyz'}" data-a="wizZone" data-v="${target}:${i}">
    <span style="position:absolute;top:6px;left:9px;font-size:11px;font-weight:700;color:var(--ink-m)">Z${z}</span>${z === 1 && serveUs ? `<span style="position:absolute;top:5px;right:6px">${ballSvg()}</span>` : ''}
    ${p ? `<span class="num" style="font-size:26px;font-weight:700">${p.n}</span><span style="font-size:13px;font-weight:600">${esc(first(id))}</span>` : `<span style="font-size:13px;font-weight:600;color:var(--ink-m)">Elegir</span>`}</button>`; };
  return `<div class="zones"><div class="net" style="grid-column:1/-1"></div>${zone(3, 4)}${zone(2, 3)}${zone(1, 2)}${zone(4, 5)}${zone(5, 6)}${zone(0, 1)}</div>`;
}

function liveScreen() {
  const m = cur(); if (!m) { route = { name: 'home' }; return homeScreen(); }
  const st = replay(m); const set = st.sets[st.sets.length - 1]; const ct = courtOf(st);
  const prev = ui.lastScore; const bumpUs = prev && prev.id === m.id && prev.us !== set.us; const bumpThem = prev && prev.id === m.id && prev.them !== set.them;
  ui.lastScore = { id: m.id, us: set.us, them: set.them };
  const setDots = Array.from({ length: Math.max(st.bestOf, st.sets.length) }, (_, i) => { const s = st.sets[i]; return `<i class="${s && s.winner ? s.winner : ''}"></i>`; }).join('');

function describe(ev, m) {

  if (ev.t === 'action') return `#${P(ev.pid).n} ${first(ev.pid)} · ${SKILL[ev.skill]} · ${outLabel(ev.skill, ev.out)}`;
  if (ev.t === 'point') return CAUSE_ONE[ev.cause] + (ev.kind ? ` · ${KIND_LABEL[ev.kind] || ''}` : '');
  if (ev.t === 'sub') return `Cambio: entra ${first(ev.in)} por ${first(ev.out)}`;
  if (ev.t === 'libero') return ev.dir === 'in' ? `Líbero: entra ${first(ev.lid)} por ${first(ev.pid)}` : 'Líbero: sale';
  if (ev.t === 'end') return 'Partido terminado aquí';
  if (ev.t === 'swap') return `${first(ev.a)} y ${first(ev.b)} cambian de sitio`;
  if (ev.t === 'set_end') return 'Set terminado a mano';
  if (ev.t === 'rules') return ev.target ? `Reglas: ${rulesText({ bestOf: ev.bestOf, target: ev.target, by2: ev.by2 })}` : `Ahora: ${ev.bestOf ? `mejor de ${ev.bestOf}` : 'sets sin límite'}`;
  if (ev.t === 'timeout') return `Tiempo muerto ${ev.side === 'us' ? 'nuestro' : 'del rival'}`;
  return '';
}

function record(ev, msg) {

  const before = replay(m);
  ev.id = newId(); if (me) ev.by = me;
  commit({ t: 'ev_add', mid: m.id, eid: ev.id, ev });
  const after = replay(matchById(m.id));
  ui.sel = null;
  const scored = after.points.length > before.points.length;
  vibrate(scored ? 22 : 10);
  if (after.finished && !before.finished) { vibrate([30, 60, 30]); toast('Partido terminado'); }
  else if (after.needSetStart && !before.needSetStart && after.setNo === before.setNo && after.sets.length && after.sets[after.sets.length - 1].closed && !before.sets[before.sets.length - 1].closed) toast(`Fin del set ${after.setNo}`);
  else { const note = after.log[after.log.length - 1].note; toast(note || msg); }
  render();
}

    lineup, libero: pl.liberoIds && ids.has(pl.liberoIds[0]) ? pl.liberoIds[0] : '', first: pl.firstServer || 'us' };
  go({ name: 'new' });
}

const app = document.getElementById('app');

  let html = '';

  else if (route.name === 'new') html = newMatchScreen();

  else if (route.name === 'summary') html = summaryScreen(route.id);
  else { route = { name: 'home' }; html = homeScreen(); }
  app.className = 'app' + (route.name === 'live' ? ' fill' : '');
  app.innerHTML = html + sheetHtml();
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) { /* date inputs */ } } }
  if (scrollTop) window.scrollTo(0, 0);
  keepAwake(route.name === 'live');
  if (!sync.timer) schedule();
  // Ask who's recording once there's someone to pick (also after the name-only version).
  if (SHARED && sync.loaded && DB.team && !meId && roster().length && !ui.sheet && !ui.askedName) { ui.askedName = true; ui.sheet = { kind: 'whoami' }; render(); }
}
let wakeLock = null;
