<title>VolApp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column; tabs as a floating pill bar; live screen fills the viewport. */
:root {
  --bg: #2A2925; --raised: #35342F; --line: #46443E;
  --cream: #F3F0DC; --sage: #D8DBC3;
  --orange: #EB6E3A; --orange-p: #D35C2B;
  --green: #6F9A5C; --green-s: #A9C391; --red: #C25A4A; --red-s: #E1A194; --ochre: #D9A441;
  --tx: #F3F0DC; --tx-m: rgba(243,240,220,.62); --tx-f: rgba(243,240,220,.38);
  --ink: #2A2925; --ink-m: rgba(42,41,37,.62); --ink-f: rgba(42,41,37,.14);
  --display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --body: 'Inter Tight', ui-sans-serif, system-ui, sans-serif;
  --r-md: 18px; --r-lg: 24px; --r-xl: 28px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--tx); font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { -webkit-user-select: none; user-select: none; }
textarea.input { min-height: 110px; padding: 12px; font-size: 13px; resize: vertical; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.app.fill { height: 100%; min-height: 0; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-block: 16px 24px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 40px; line-height: 1.05; letter-spacing: -1.2px; font-weight: 700; }
h2 { font-size: 26px; line-height: 1.1; letter-spacing: -.5px; font-weight: 700; }
h3 { font-size: 19px; line-height: 1.2; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tx-m); }
.muted { color: var(--tx-m); }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Cards */
.card { border-radius: var(--r-xl); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.card.cream { background: var(--cream); color: var(--ink); }
.card.sage { background: var(--sage); color: var(--ink); }
.card.dark { background: var(--raised); }
.card.cream .eyebrow, .card.sage .eyebrow, .card.cream .muted, .card.sage .muted { color: var(--ink-m); }
button.card { text-align: left; width: 100%; transition: transform .12s; }
button.card:active { transform: scale(.985); }

/* Buttons */
.btn { min-height: 56px; border-radius: var(--r-lg); padding: 0 22px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s, background .1s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--orange); color: var(--ink); width: 100%; font-family: var(--display); font-size: 18px; }
.btn.primary:active { background: var(--orange-p); }
.btn.secondary { background: var(--cream); color: var(--ink); }
.btn.ghost { border: 1.5px solid var(--line); }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.link { color: var(--tx-m); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; align-self: center; min-height: 44px; }
.back { width: 44px; height: 44px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; flex: none; }

/* Pills, chips, badges */
.pills { display: flex; gap: 6px; background: var(--raised); padding: 5px; border-radius: 999px; }
.pills.light { background: var(--ink-f); }
.pill { flex: 1; min-height: 40px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--tx-m); padding: 0 12px; white-space: nowrap; }
.pills.light .pill { color: var(--ink-m); }
.pill.on { background: var(--orange); color: var(--ink); }
.chip { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--orange); color: var(--ink); white-space: nowrap; }
.chip.win { background: var(--green); } .chip.loss { background: var(--red); }
.chip.quiet { background: transparent; border: 1px solid var(--line); color: var(--tx-m); }
.chip.light { background: var(--ink-f); color: var(--ink); }
.badge { min-width: 34px; height: 34px; border-radius: 17px; background: var(--orange); color: var(--ink); display: inline-grid; place-items: center; font-family: var(--display); font-weight: 700; padding: 0 6px; flex: none; }
.badge.lg { min-width: 64px; height: 64px; border-radius: 32px; font-size: 30px; }
.badge.sage { background: var(--sage); }

/* Empty / stripes */
.empty { border: 1.5px dashed var(--line); border-radius: var(--r-xl); padding: 28px 20px; text-align: center; display: flex; flex-direction: column; gap: 6px;
  background-image: repeating-linear-gradient(45deg, rgba(243,240,220,.05) 0 4px, transparent 4px 12px); }

/* Tab bar */
.tabbar { position: sticky; bottom: 0; padding-block: 8px max(10px, env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.tabbar .track { display: flex; gap: 6px; padding: 6px; background: var(--raised); border-radius: 999px; }
.tab { flex: 1; min-height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--tx-m); font-weight: 600; font-size: 14px; transition: flex .2s, background .2s; }
.tab.on { background: var(--orange); color: var(--ink); flex: 1.7; }
.tab svg { width: 20px; height: 20px; }

/* Lists */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--raised); min-height: 64px; width: 100%; text-align: left; }
.item .grow { flex: 1; min-width: 0; }
.item .name { font-weight: 600; }
.item .sub { font-size: 13px; color: var(--tx-m); }

/* Live */
.live { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-block: 10px; min-height: 0; }
.scoreboard { background: var(--raised); border-radius: var(--r-xl); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 6px; }
.scores { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.side { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.side .tname { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tx-m); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side .pts { font-family: var(--display); font-weight: 700; font-size: 60px; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.side.serving .tname { color: var(--orange); }
.dash { font-family: var(--display); font-size: 30px; color: var(--tx-f); }
.servedot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--orange); margin-right: 5px; vertical-align: middle; }
.bump { animation: bump .32s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); color: var(--orange); } 100% { transform: scale(1); } }
.setdots { display: flex; gap: 4px; }
.setdots i { width: 10px; height: 10px; border-radius: 5px; background: var(--line); display: block; }
.setdots i.us { background: var(--orange); } .setdots i.them { background: var(--tx-m); }
.court { background: var(--sage); border-radius: var(--r-xl); padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; position: relative; }
.net { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 10px); opacity: .35; }
.pl { min-height: 72px; border-radius: var(--r-md); background: var(--cream); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; position: relative; transition: transform .1s, background .15s; }
.pl:active { transform: scale(.96); }
.pl .pn { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; }
.pl .pnm { font-size: 13px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.pl .zone { position: absolute; top: 6px; left: 8px; font-size: 10px; font-weight: 700; color: var(--ink-m); }
.pl .ball { position: absolute; top: 5px; right: 6px; }
.pl.lib { background: #EFD9B8; }
.pl.sel { background: var(--orange); }
.panel { background: var(--raised); border-radius: var(--r-xl); padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 150px; }
.panel .hint { text-align: center; color: var(--tx-m); font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.act { min-height: 56px; border-radius: var(--r-md); background: var(--bg); font-weight: 600; font-size: 15px; padding: 4px 6px; transition: transform .1s; }
.act:active { transform: scale(.97); }
.act.dim { opacity: .5; }
.act.us { background: var(--orange); color: var(--ink); font-family: var(--display); font-size: 18px; }
.act.them { background: var(--cream); color: var(--ink); font-family: var(--display); font-size: 18px; }
.act.pos { background: var(--green); color: var(--ink); }
.act.neg { background: var(--red); color: var(--ink); }
.act.warn { background: var(--ochre); color: var(--ink); }
.act.neu { background: var(--cream); color: var(--ink); }
.toolbar { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr 1fr; gap: 6px; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tool { min-height: 56px; border-radius: var(--r-md); background: var(--raised); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--tx-m); }
.tool.undo { background: var(--cream); color: var(--ink); font-size: 13px; }
.tool svg { width: 20px; height: 20px; }

/* Sheet & toast */
.scrim { position: fixed; inset: 0; background: rgba(20,19,17,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { width: 100%; max-width: 472px; max-height: 86%; overflow: auto; background: var(--bg); border-radius: 28px 28px 0 0; border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up .2s ease-out; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; background: var(--cream); color: var(--ink); border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.35); animation: toast 1.8s forwards; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--tx-m); }
.input { min-height: 56px; border-radius: var(--r-md); background: var(--raised); border: 1.5px solid var(--line); color: var(--tx); padding: 0 16px; font: 500 17px var(--body); width: 100%; }
.err { color: var(--red-s); font-size: 13px; }

/* Charts & stats */
.bar { height: 10px; border-radius: 5px; background: var(--ink-f); overflow: hidden; }
.dark .bar { background: var(--line); }
.bar > i { display: block; height: 100%; border-radius: 5px; background: var(--orange); }
.stackbar { display: flex; height: 34px; border-radius: 12px; overflow: hidden; gap: 3px; }
.stackbar > div { display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--ink); min-width: 0; transition: flex .4s; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.insight { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.2; }
.recdots { display: flex; flex-wrap: wrap; gap: 5px; }
.recdots i { width: 14px; height: 14px; border-radius: 7px; display: block; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: end; }
.stat .bar { grid-column: 1 / -1; height: 14px; border-radius: 7px; }
.stat .bar > i { border-radius: 7px; }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.detail { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; border-top: 1px solid var(--ink-f); padding-top: 10px; }
.detail b { font-variant-numeric: tabular-nums; }
.zones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--sage); border-radius: var(--r-xl); padding: 10px; }
.zbtn { min-height: 76px; border-radius: var(--r-md); background: var(--cream); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.zbtn.emptyz { background: transparent; border: 2px dashed rgba(42,41,37,.3); }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--orange); }
.choice { min-height: 96px; border-radius: var(--r-lg); background: var(--raised); font-family: var(--display); font-size: 20px; font-weight: 700; border: 2px solid transparent; }
.choice.on { border-color: var(--orange); background: rgba(235,110,58,.14); }
.overlay-card { position: absolute; inset: 0; background: rgba(42,41,37,.92); border-radius: var(--r-xl); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; z-index: 2; animation: fade .25s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-height: 640px) { .side .pts { font-size: 48px; } .pl { min-height: 60px; } .act { min-height: 52px; } }
</style>

</head>
<body>
<div id="app" class="app"></div>

<script>
'use strict';
// ---------- Utilities --------------------------------------------------------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fmtDate = (d) => { const [, m, dd] = d.split('-'); return `${+dd} ${MONTHS[+m - 1]}`; };
const pct = (x) => `${Math.round(x * 100)}%`;
const vibrate = (ms = 12) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* not supported */ } };
const ICON = {
  home: '<path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',
  team: '<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M16 14.3c2.3 0 4 1.5 4.5 4.2"/>',
  season: '<path d="M4 19h16M6 15l4-4 3 3 5-6"/>',
  undo: '<path d="M9 7 5 11l4 4M5 11h9a5 5 0 0 1 0 10h-2"/>',
  back: '<path d="m14 6-6 6 6 6"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  list: '<path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"/>',
  swap: '<path d="M7 4 4 7l3 3M4 7h12M17 14l3 3-3 3M20 17H8"/>',
  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  share: '<path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  trash: '<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>', edit: '<path d="M5 19h3.5L19 8.5 15.5 5 5 15.5zM13.5 7l3.5 3.5"/>',
  shield: '<path d="M12 4 5 7v5c0 4 3 6.5 7 8 4-1.5 7-4 7-8V7z"/>',
};
const icon = (n, size = 22) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const ballSvg = (s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-label="saca"><circle cx="12" cy="12" r="10" fill="#EB6E3A"/><path d="M12 2c-2 4-1.5 8.5 1.2 11.8M3.3 7.5c4-.4 8 1.3 10 4.6M5.5 19.5c1.5-3.6 4.5-6.2 8.3-7" stroke="#2A2925" stroke-width="1.6" fill="none"/></svg>`;

// ---------- Domain: skills, outcomes, point causes ----------------------------
const SKILL = { serve: 'Saque', reception: 'Recepción', attack: 'Ataque', block: 'Bloqueo', defense: 'Defensa', error: 'Error' };
const OUTS = {
  serve: [['ace', 'Punto directo', 'pos'], ['in_play', 'En juego', 'neu'], ['error', 'Error', 'neg']],
  reception: [[3, '3 · Perfecta', 'pos'], [2, '2 · Buena', 'neu'], [1, '1 · Mala', 'warn'], [0, '0 · Nos hacen punto', 'neg']],
  attack: [['kill', 'Punto', 'pos'], ['in_play', 'En juego', 'neu'], ['error', 'Error', 'neg'], ['blocked', 'Bloqueado', 'neg']],
  block: [['point', 'Punto de bloqueo', 'pos']],
  defense: [['good', 'Buena', 'pos'], ['error', 'Error', 'neg']],
  error: [['unforced', 'Error no forzado', 'neg']],
};
const outLabel = (skill, out) => (OUTS[skill].find((o) => o[0] === out) || [, ''])[1];
function causeOf(skill, out) {
  if (skill === 'serve') return out === 'ace' ? 'ourWinner' : out === 'error' ? 'ourError' : null;
  if (skill === 'reception') return out === 0 ? 'theirWinner' : null;
  if (skill === 'attack') return out === 'kill' ? 'ourWinner' : out === 'error' ? 'ourError' : out === 'blocked' ? 'theirWinner' : null;
  if (skill === 'block') return 'ourWinner';
  if (skill === 'defense') return out === 'error' ? 'theirWinner' : null;
  return 'ourError';
}
const winnerOf = (c) => (c === 'ourWinner' || c === 'theirError' ? 'us' : 'them');
const CAUSES = ['ourWinner', 'theirError', 'theirWinner', 'ourError'];
const CAUSE_LABEL = { ourWinner: 'Puntos nuestros', theirError: 'Errores del rival', theirWinner: 'Puntos del rival', ourError: 'Errores nuestros' };
const CAUSE_ONE = { ourWinner: 'Punto nuestro', theirError: 'Error del rival', theirWinner: 'Punto del rival', ourError: 'Error nuestro' };
const CAUSE_COLOR = { ourWinner: 'var(--green)', theirError: 'var(--green-s)', theirWinner: 'var(--red)', ourError: 'var(--red-s)' };
const REC_COLOR = ['var(--red)', 'var(--ochre)', 'var(--green-s)', 'var(--green)'];
const POS = { colocadora: 'Colocadora', opuesta: 'Opuesta', central: 'Central', receptora: 'Receptora', libero: 'Líbero' };

// ---------- Engine: replay events into match state ---------------------------
function replay(m) {
  const st = { sets: [], setNo: 0, serving: null, rot: null, rotCount: 0, libero: null, liberoIds: [], subs: 0, timeouts: { us: 0, them: 0 },
    setsUs: 0, setsThem: 0, finished: false, needSetStart: true, points: [], actions: [], log: [] };
  m.events.forEach((ev, i) => apply(st, ev, i, m));
  return st;
}
const courtOf = (st) => (st.rot ? st.rot.map((id) => (st.libero && id === st.libero.replaced ? st.libero.id : id)) : []);
function apply(st, ev, i, m) {
  const entry = { i, ev, set: st.setNo, note: null };

function blankPlayer() { return { serve: { n: 0, ace: 0, err: 0 }, rec: { n: 0, sum: 0 }, att: { n: 0, kill: 0, err: 0, blk: 0 }, block: 0, def: { good: 0, err: 0 }, unforced: 0, pts: 0 }; }
function detailKey(p) {
  if (p.cause === 'ourWinner') return p.skill === 'serve' ? 'Saques directos' : p.skill === 'attack' ? 'Ataques' : p.skill === 'block' ? 'Bloqueos' : 'Sin jugadora';
  if (p.cause === 'ourError') return p.skill === 'serve' ? 'Fallos de saque' : p.skill === 'attack' ? 'Fallos de ataque' : p.skill === 'error' ? 'Fallos no forzados' : 'Sin jugadora';

    const st = replay(m);

    for (const a of st.actions) {

      if (a.skill === 'serve') { ps.serve.n++; if (a.out === 'ace') { ps.serve.ace++; ps.pts++; } if (a.out === 'error') ps.serve.err++; }
      if (a.skill === 'reception') { ps.rec.n++; ps.rec.sum += a.out; S.receptions.push({ q: a.out, pid: a.pid }); }

// ---------- Store ------------------------------------------------------------
// Every change is an operation appended to a log; the data is rebuilt from the
// log. Inside Google Apps Script the log is shared through a spreadsheet, so
// several phones can record at the same time. Elsewhere it stays on this phone.
const SHARED = !!(window.google && google.script && google.script.run);
const KEYS = SHARED ? { log: 'volapp-shared-log', ver: 'volapp-shared-ver', pending: 'volapp-shared-pending' } : { log: 'volapp-log', ver: 'volapp-log-ver', pending: 'volapp-pending' };
const store = {

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },

let log = store.get(KEYS.log, []);      // operations confirmed by the spreadsheet (or all of them, on a single phone)
let ver = store.get(KEYS.ver, 0);       // how many spreadsheet rows this phone already has
let pending = store.get(KEYS.pending, []); // recorded here, not yet sent
let acked = [];                         // sent and confirmed, not yet pulled back
let me = store.get('volapp-name', '');
const sync = { state: SHARED ? 'connecting' : 'local', loaded: !SHARED || log.length > 0, inflight: null, timer: null };

function opsFromDb(db) {
  const ops = [];

    for (const e of m.events || []) { const ev = { ...e, id: e.id || newId() }; ops.push({ t: 'ev_add', mid: m.id, eid: ev.id, ev }); }

    if (o.t === 'team') db.team = o.name;

// Data saved by the first single-phone version.
if (!SHARED && !log.length) { const old = store.get('volapp-v1', null); if (old && old.team) { log = opsFromDb(old); store.set(KEYS.log, log); } }

function overlay(m, st) {

function panel(m, st, ct) {

  const s = ui.sel;

    const skills = ['serve', 'reception', 'attack', 'block', 'defense', 'error'].filter((k) => !(p.lib && (k === 'attack' || k === 'block' || k === 'serve')));
    const hot = isServer ? 'serve' : receiving ? 'reception' : 'attack';
    const order = [hot, ...skills.filter((k) => k !== hot)].filter((k) => skills.includes(k));
    return `<div class="row between"><b>#${p.n} ${esc(first(s.pid))}</b><button class="chip quiet" data-a="cancelSel">Cancelar</button></div>
      <div class="grid3">${order.map((k, idx) => `<button class="act ${idx === 0 ? 'us' : ''} ${k === 'serve' && !isServer ? 'dim' : ''}" style="${idx === 0 ? 'font-size:16px' : ''}" data-a="selSkill" data-v="${k}">${SKILL[k]}</button>`).join('')}</div>`;
  }
  const outs = OUTS[s.skill];
  return `<div class="row between"><b>#${p.n} ${esc(first(s.pid))} · ${SKILL[s.skill]}</b><button class="chip quiet" data-a="selSkill" data-v="">Atrás</button></div>

function rallyStarted(m, st) {
  // A rally is open if the last scoring-relevant event was a non-point action.
  for (let i = st.log.length - 1; i >= 0; i--) {
    const e = st.log[i]; if (e.ignored) continue; const ev = e.ev;
    if (ev.t === 'action') return !causeOf(ev.skill, ev.out);
    if (ev.t === 'point' || ev.t === 'set_start') return false;
  }
  return false;
}

function describe(ev, m) {
  if (ev.t === 'set_start') return `Empieza el set · saca ${ev.firstServer === 'us' ? 'nuestro equipo' : m.opponent}`;
  if (ev.t === 'action') return `#${P(ev.pid).n} ${first(ev.pid)} · ${SKILL[ev.skill]} · ${outLabel(ev.skill, ev.out)}`;

function record(ev, msg) {

  const before = replay(m);
  ev.id = newId(); if (me) ev.by = me;
  commit({ t: 'ev_add', mid: m.id, eid: ev.id, ev });
  const after = replay(matchById(m.id));
  ui.sel = null;
  const scored = after.points.length > before.points.length;
  vibrate(scored ? 22 : 10);
  if (after.finished) { vibrate([30, 60, 30]); toast('Partido terminado'); }
  else if (after.needSetStart && !before.needSetStart) toast(`Fin del set ${after.setNo}`);
  else { const note = after.log[after.log.length - 1].note; toast(note || msg); }
  render();
}

    try {
      const d = JSON.parse(((ui.form && ui.form.imp) || '').trim());
      if (!d || !Array.isArray(d.players) || !Array.isArray(d.matches)) throw new Error('bad');
      if (!SHARED) { log = []; store.set(KEYS.log, log); }
      commit(...opsFromDb(d)); ui.sheet = null; stack.length = 0; route = { name: 'home' };
      toast(SHARED ? 'Copia añadida a los datos del equipo' : 'Copia restaurada'); render(true);
    } catch (e) { ui.form.err = 'Ese texto no es una copia válida. Pégala entera, desde la primera llave hasta la última.'; render(); }
  },
  sheet: (v) => { if (v === 'backup') ui.form = {}; ui.sheet = { kind: v }; render(); },
  closeSheet: () => { ui.sheet = null; render(); },
  delEv: (v) => { const m = cur(); commit({ t: 'ev_del', mid: m.id, eid: v }); toast('Acción borrada'); render(); },
  editEv: (v) => { ui.sheet = { kind: 'edit', id: v }; render(); },
  setOut: (v) => {
    const m = cur(); const old = m.events.find((e) => e.id === ui.sheet.id); if (!old) { ui.sheet = { kind: 'history' }; return render(); }
    const ev = { ...old, out: old.skill === 'reception' ? +v : v };
    commit({ t: 'ev_set', mid: m.id, eid: ev.id, ev }); ui.sheet = { kind: 'history' }; toast('Acción corregida'); render();
  },
  saveName: () => { me = ((ui.form && ui.form.me) || '').trim(); store.set('volapp-name', me); ui.sheet = null; ui.form = null; if (me) toast(`Hola, ${me}`); render(); },
  editName: () => { ui.form = { me }; ui.sheet = { kind: 'whoami' }; render(); },
  retry: () => { setSync('connecting'); render(); flush(); },
  subOut: (v) => { const st = replay(cur()); if (st.subs >= 6) { toast('Ya no quedan cambios en este set'); return; } ui.sheet = { kind: 'sub', out: v }; render(); },
  subIn: (v) => { const out = ui.sheet.out; ui.sheet = null; record({ t: 'sub', out, in: v }, `Entra ${first(v)} por ${first(out)}`); },
  timeout: (v) => { ui.sheet = null; record({ t: 'timeout', side: v }, `Tiempo muerto ${v === 'us' ? 'nuestro' : 'del rival'}`); },
  liberoIn: (v) => { const st = replay(cur()); ui.sheet = null; record({ t: 'libero', dir: 'in', lid: st.liberoIds[0], pid: v }, `Entra ${first(st.liberoIds[0])} por ${first(v)}`); },
  liberoOut: () => { ui.sheet = null; record({ t: 'libero', dir: 'out' }, 'Sale la líbero'); },
  toggle: (v) => { ui.open[v] = !ui.open[v]; render(); },
  momSet: (v) => { ui.momSet = +v; render(); },
  rot: (v) => { ui.rotSel = ui.rotSel === +v ? null : +v; render(); },
  ficha: (v) => { ui.ficha = v; render(); },
  share: () => toast('En la app se genera una imagen para compartir'),
  addPlayer: () => { ui.form = { name: '', n: '', pos: 'receptora', err: '' }; ui.sheet = { kind: 'player' }; render(); },
  formPos: (v) => { ui.form.pos = v; render(); },
  savePlayer: () => {
    const f = ui.form; const n = parseInt(f.n, 10);
    if (!f.name.trim()) f.err = 'Escribe el nombre.';
    else if (!(n >= 0 && n <= 99)) f.err = 'El dorsal tiene que ser un número entre 0 y 99.';
    else if (roster().some((p) => p.n === n && p.id !== f.id)) f.err = `El dorsal ${n} ya lo lleva ${first(roster().find((p) => p.n === n).id)}.`;
    else {
      commit({ t: 'player', p: { id: f.id || newId(), name: f.name.trim(), n, pos: f.pos, lib: f.pos === 'libero', active: true } });
      ui.sheet = null; toast(`${f.name.trim().split(' ')[0]} ${f.id ? 'actualizada' : 'añadida'}`); return render();
    }
    render();
  },
};

// ---------- Render -----------------------------------------------------------
const app = document.getElementById('app');
function render(scrollTop) {
  const focusId = document.activeElement && document.activeElement.id; const caret = document.activeElement && document.activeElement.selectionStart;
  let html = '';
  if (SHARED && !sync.loaded) html = connectingScreen();
  else if (!DB.team) html = welcomeScreen();
  else if (route.name === 'home') html = homeScreen();
  else if (route.name === 'team') html = teamScreen();
  else if (route.name === 'season') html = seasonScreen();
  else if (route.name === 'player') html = playerScreen(route.id);
  else if (route.name === 'new') html = newMatchScreen();
  else if (route.name === 'live') html = liveScreen();
  else if (route.name === 'summary') html = summaryScreen(route.id);
  app.className = 'app' + (route.name === 'live' ? ' fill' : '');
  app.innerHTML = html + sheetHtml();
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) { /* date inputs */ } } }
  if (scrollTop) window.scrollTo(0, 0);
  keepAwake(route.name === 'live');
  if (!sync.timer) schedule();
  if (SHARED && sync.loaded && DB.team && !me && !ui.sheet && !ui.askedName) { ui.askedName = true; ui.form = { me: '' }; ui.sheet = { kind: 'whoami' }; render(); }
}
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* not available */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (route.name === 'live') keepAwake(true); flush(); }
  schedule();
});
window.addEventListener('online', () => flush());
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.a === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('button[data-a="closeSheet"]')) return;
  if (el.hasAttribute('disabled')) return;
  const fn = H[el.dataset.a]; if (fn) fn(el.dataset.v);
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.in && ui.wiz) ui.wiz[t.dataset.in] = t.value;
  if (t.dataset.form) { ui.form = ui.form || {}; ui.form[t.dataset.form] = t.value; }
});
rebuild();
render();
flush();
</script>
